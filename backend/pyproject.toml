[project]
name = "kestrel-document-tracker"
version = "0.1.0"
description = "Kestrel Document Tracker prototype (synthetic data only)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::SyntaxWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = ["S101", "S311", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"app/seed.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
strict = true
warn_unused_ignores = false
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["google.*"]
ignore_missing_imports = true
