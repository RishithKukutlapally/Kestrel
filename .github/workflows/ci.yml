name: CI

on:
  pull_request:


permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kestrel
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: kestrel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kestrel" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Mypy
        run: mypy
      - name: Pytest (SQLite)
        run: pytest
      - name: Migrations and seed on PostgreSQL (same code, no changes)
        env:
          DATABASE_URL: postgresql+psycopg://kestrel@localhost:5432/kestrel
          DB_PASSWORD: ci-only-password
          DEMO_PASSWORD_TEMPLATE: "{Name}-ci-only"
          PASSWORD_HASH_ITERATIONS: "1000"
        run: |
          alembic upgrade head
          python -m app.seed
          python -m app.seed --reset
          alembic downgrade base && alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: TypeScript build
        run: npm run build
      - name: Vitest
        run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker build (no push)
        run: docker build -t kestrel-tracker:ci .
      - name: Container smoke test
        run: |
          docker run -d --name k -p 8080:8080 \
            -e APP_ENV=local -e SESSION_SECRET=ci-only \
            -e COOKIE_SECURE=false -e DATABASE_URL=sqlite:////tmp/k.db kestrel-tracker:ci
          for i in $(seq 1 30); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          curl -fsS localhost:8080/login | grep -q "Username"
          test "$(docker exec k id -u)" != "0"
          docker rm -f k
